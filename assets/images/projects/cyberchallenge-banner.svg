<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080a" />
      <stop offset="50%" stop-color="#081418" />
      <stop offset="100%" stop-color="#020506" />
    </linearGradient>

    <!-- Neon Green Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff66" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#cyberGrid)" />

  <!-- Scanline Overlay -->
  <line x1="0" y1="90" x2="800" y2="90" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Terminal Window Container -->
  <rect x="50" y="40" width="700" height="370" rx="12" fill="#060c0e" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glowGreen)" />

  <!-- Terminal Header Bar -->
  <rect x="50" y="40" width="700" height="38" rx="12" fill="#0b171c" />
  <rect x="50" y="66" width="700" height="12" fill="#0b171c" />
  <line x1="50" y1="78" x2="750" y2="78" stroke="#00ff66" stroke-opacity="0.25" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="75" cy="59" r="6" fill="#ff5f56" />
  <circle cx="95" cy="59" r="6" fill="#ffbd2e" />
  <circle cx="115" cy="59" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="400" y="64" font-family="'Courier New', monospace" font-size="13" fill="#64ffda" text-anchor="middle" letter-spacing="1">root@unife-ctf: ~/cyberchallenge.it</text>

  <!-- Cyber Shield Icon -->
  <g transform="translate(140, 200)" filter="url(#glowCyan)">
    <!-- Shield Outer -->
    <path d="M 0,-70 L 50,-40 L 50,20 Q 50,65 0,90 Q -50,65 -50,20 L -50,-40 Z" fill="none" stroke="#00f0ff" stroke-width="3" />
    <!-- Shield Inner -->
    <path d="M 0,-55 L 38,-30 L 38,15 Q 38,50 0,72 Q -38,50 -38,15 L -38,-30 Z" fill="#00f0ff" fill-opacity="0.1" stroke="#00ff66" stroke-width="1.5" />
    <!-- Keyhole / Terminal Symbol inside Shield -->
    <path d="M -12,-15 L 0,-30 L 12,-15 L 0,0 Z" fill="#00ff66" />
    <rect x="-4" y="0" width="8" height="24" rx="2" fill="#00ff66" />
  </g>

  <!-- Text / Content -->
  <g transform="translate(260, 140)">
    <!-- Tag -->
    <rect x="0" y="0" width="205" height="24" rx="4" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
    <text x="10" y="16" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff66" letter-spacing="1.5">● CTF COMPETITION</text>

    <!-- Main Title -->
    <text x="0" y="60" font-family="'Courier New', monospace" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="2">CYBERCHALLENGE.IT</text>

    <!-- Node Subtitle -->
    <text x="0" y="90" font-family="'Courier New', monospace" font-size="16" fill="#00f0ff" font-weight="bold" letter-spacing="1.5">UNIFE NODE // UNIVERSITÀ DI FERRARA</text>

    <!-- Terminal Code Lines -->
    <g transform="translate(0, 120)" font-family="'Courier New', monospace" font-size="13">
      <text x="0" y="0" fill="#a0aec0"><tspan fill="#00ff66">[✓]</tspan> Training: WebSec, Crypto, Binary, RevEng</text>
      <text x="0" y="22" fill="#a0aec0"><tspan fill="#00ff66">[✓]</tspan> Qualification: Local CTF Challenge</text>
      <text x="0" y="44" fill="#a0aec0"><tspan fill="#00ff66">[✓]</tspan> Status: <tspan fill="#00f0ff">CERTIFIED OPERATOR</tspan></text>
    </g>

    <!-- Prompt Prompt -->
    <g transform="translate(0, 205)" font-family="'Courier New', monospace" font-size="14" font-weight="bold">
      <text x="0" y="0" fill="#00ff66">> ./launch_presentation.sh<tspan fill="#00f0ff" opacity="0.8">_</tspan></text>
    </g>
  </g>

  <!-- Corner Brackets for Tech HUD look -->
  <path d="M 60 90 L 60 70 L 80 70" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 740 90 L 740 70 L 720 70" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 60 380 L 60 400 L 80 400" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 740 380 L 740 400 L 720 400" stroke="#00ff66" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
